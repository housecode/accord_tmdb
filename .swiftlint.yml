included:
  - App
  - Core
  - Modules
  - Tests
disabled_rules:
  - trailing_comma
opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
line_length:
  warning: 140
  error: 180
type_body_length:
  warning: 300
file_length:
  warning: 400
identifier_name:
  min_length: 2
  excluded: [id, vc]
